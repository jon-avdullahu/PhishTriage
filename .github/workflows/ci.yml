name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest ruff
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: python -m pytest -q

  powershell:
    runs-on: windows-latest
    env:
      PHISHTRIAGE_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path powershell -Recurse -Severity Warning, Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
      - name: Pester on PowerShell 7
        shell: pwsh
        run: Invoke-Pester -Path powershell/tests -CI
      - name: Pester on Windows PowerShell 5.1
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Invoke-Pester -Path powershell/tests -CI

  kql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Check KQL queries against the table schemas
        run: dotnet run --project tools/KqlCheck -- kql
