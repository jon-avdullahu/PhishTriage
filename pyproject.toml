[project]
name = "phishtriage"
version = "0.1.0"
description = "Offline triage of user-reported phishing e-mails"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
phishtriage = "phishtriage.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]  # word lists read better as one string
